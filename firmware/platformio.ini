[platformio]
default_envs = nucleo_h743zi
src_dir = src
include_dir = include

; Development target for the TR1604-Pro controller firmware.
; Production hardware will use an STM32H743VIT6 on the custom main PCB.
[env:nucleo_h743zi]
platform = ststm32
board = nucleo_h743zi
framework = stm32cube
build_flags =
  -std=c11
  -Wall
  -Wextra
  -Werror=return-type
  -DTG4132_HW_REV_A=1
  -DTG4132_MCU_STM32H743=1
monitor_speed = 115200
