name: TR1604ProSimulator
options:
  bundleIdPrefix: nl.pd1dmr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  TR1604ProSimulator:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.pd1dmr.TR1604ProSimulator
        PRODUCT_NAME: TR1604-Pro Simulator
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TR1604-Pro
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
